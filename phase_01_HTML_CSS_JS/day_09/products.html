<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="container">
        <h1>Products</h1>
        <h3 id="welcomeText">Welcome : </h3>
        <button id="logout">Logout</button>

    </div>

    <div id="falseUser"></div>
    
</body>
</html>
<script>
    let container = document.getElementById("container")
    let falseUser = document.getElementById("falseUser")
    let welcomeText = document.getElementById("welcomeText")
    let logoutButton = document.getElementById("logout")
    let checks_status = localStorage.getItem("isLoggedIn")
    let currentUser = JSON.parse(localStorage.getItem("current_user") || "null")

    if (checks_status === "true" && currentUser) {
        container.style.display = "block"
        falseUser.style.display = "none"
        welcomeText.textContent = `Welcome : ${currentUser.username}`
        logoutButton.addEventListener("click", () => {
            localStorage.removeItem("isLoggedIn")
            localStorage.removeItem("current_user")
            window.location.href = "login.html"
        })
    } else {
        container.style.display = "none"
        falseUser.innerHTML = '<h1>Please login</h1>'
        falseUser.innerHTML += '<a href="login.html">Login</a>'
    }
</script>
