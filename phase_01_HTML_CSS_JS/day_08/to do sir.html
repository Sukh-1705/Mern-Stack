<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-9ndCyUa0R11k2VZj2Lel9r6AQAQteuCv1zDi6E3o6rl8yJqDf69LEMZ9QxhdP2vh" crossorigin="anonymous">

<style>
    #container{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    #inpConstainer{
        width: 50%;

    }
</style>
<body>
    <div id = "container">
        <div id = "inpConstainer">
            <div class="input-group mb-3">
                <h1>Simple To-Do List</h1>
                <input id = "task" type="text" class="form-control"  >
                <button class="btn btn-outline-secondary" type="button" id="button-addon2">Add Task</button>
                <button class="btn btn-outline-secondary" type="button" id="button-addon2">Remove Last Task</button>
            </div>
             
        </div>
    </div>
</body>
</html>
<script>
    let todos=[]
    let text = document.getElementById("task")

    let handleclick = () =>{
        let task = {
            title: text.value,
            status: false
        }
        todos.push(task)
        render()
         let taskcontainer = document.getElementById("taskContainer")
         let render = () =>{
            taskcontainer.innerHTML = null
            todos.forEach((task,index) => {
                let div = document.createElement("div")
                let h3 = document.createElement("h3")

                h3.innerText = task.title
                let btn = document.createElement("button")
                btn.innerText = "Delete"
                btn.addEventListener("click",()=>{
                    deleteTask(index)
                })
                div.append(h3,btn)
                taskcontainer.append(div)

            });
         }
    }
</script>
