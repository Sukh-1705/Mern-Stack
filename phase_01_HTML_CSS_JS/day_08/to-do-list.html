<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUa0R11k2VZj2Lel9r6AQAQteuCv1zDi6E3o6rl8yJqDf69LEMZ9QxhdP2vh" crossorigin="anonymous">
</head>
<body>
    <h1>Simple To-Do List</h1>
    <div>
        <input type="text" id="taskInput" placeholder="Type a task" />
        <button id="addTaskBtn">Add Task</button>
        <button id="removeLastBtn">Remove Last Task</button>
    </div>
    <ul id="taskList"></ul>

    <script>
        const tasks = [];
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const removeLastBtn = document.getElementById('removeLastBtn');
        const taskList = document.getElementById('taskList');

        function renderTasks() {
            taskList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.textContent = task;

                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Delete';
                deleteButton.addEventListener('click', () => {
                    tasks.splice(index, 1);
                    renderTasks();
                });

                li.appendChild(deleteButton);
                taskList.appendChild(li);
            });
        }

        addTaskBtn.addEventListener('click', () => {
            const taskText = taskInput.value.trim();
            if (taskText === '') {
                return;
            }

            tasks.push(taskText);
            taskInput.value = '';
            renderTasks();
        });

        removeLastBtn.addEventListener('click', () => {
            tasks.pop();
            renderTasks();
        });

        taskInput.addEventListener('keypress', event => {
            if (event.key === 'Enter') {
                addTaskBtn.click();
            }
        });
    </script>
</body>
</html>
