<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Grade Checker</title>

</head>
<body>
    <div class="box">
        <h2>Marks Grade Checker</h2>
        <input type="number" id="marks" placeholder="Enter marks">
        <button onclick="checkGrade()">Check Grade</button>
        <div id="result"></div>
    </div>

    <script>
        function checkGrade() {
            let marks = Number(document.getElementById('marks').value);
            let result = document.getElementById('result');

            if (marks == 100) {
                result.textContent = 'Sirra lata 🤯🧠';
                result.style.color = 'black';
            } else if (marks >= 90) {
                result.textContent = 'U could do better';
                result.style.color = 'green';    
            } else if (marks >= 75) {
                result.textContent = 'Chal theek a';
                result.style.color = 'blue';
            } else if (marks >= 60) {
                result.textContent = 'Dumb little shi';
                result.style.color = 'orange';
            } else if (marks >= 40) {
                result.textContent = 'Die';
                result.style.color = 'purple';
            } else {
                result.textContent = 'Regret being born';
                result.style.color = 'red';
            }
            
        }
        


        
    </script>
</body>
</html>
